<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="640" viewBox="0 0 1250 640">
<rect width="1250" height="640" fill="#fcfcfb"/>
<text x="40" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1a1a1a">La retta di regressione</text>
<text x="40" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#8a8a90">Y &#232; la dipendente, quella che vuoi spiegare, ed &#232; sempre una. X &#232; l&#39;indipendente, e pu&#242; essere una o pi&#249;.</text>
<g transform="translate(20,126)"><text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1a1a1a">1. I due numeri che definiscono la retta</text><line x1="104" y1="146" x2="556" y2="146" stroke="#e8e8e4" stroke-width="1"/><line x1="104" y1="235" x2="556" y2="235" stroke="#e8e8e4" stroke-width="1"/><line x1="104" y1="324" x2="556" y2="324" stroke="#e8e8e4" stroke-width="1"/><line x1="104" y1="42" x2="104" y2="414" stroke="#45454a" stroke-width="2"/><line x1="104" y1="414" x2="574" y2="414" stroke="#45454a" stroke-width="2"/><path d="M 104 34 l -5 10 l 10 0 z" fill="#45454a"/><path d="M 582 414 l -10 -5 l 0 10 z" fill="#45454a"/><text x="94" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#45454a">Y  dipendente</text><text x="578" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#45454a" text-anchor="end">X  indipendente</text><text x="95" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#8a8a90" text-anchor="middle">0</text><circle cx="310.2" cy="293.7" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="315.7" cy="254.9" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="333.3" cy="237.3" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="335.0" cy="230.4" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="384.0" cy="191.1" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="248.2" cy="280.3" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="159.8" cy="300.8" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="139.5" cy="367.6" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="530.5" cy="74.9" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="378.1" cy="206.6" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="187.6" cy="267.2" r="4" fill="#5B6472" fill-opacity="0.45"/><circle cx="146.8" cy="320.3" r="4" fill="#5B6472" fill-opa