<text x="40" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8a8a90">In tutti e due i casi la retta e&#39; la stessa e resta corretta. Cambia solo quanto e&#39; precisa, e a destra la precisione dipende da dove ti trovi.</text>
