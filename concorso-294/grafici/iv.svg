<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560">
<rect width="1250" height="560" fill="#fcfcfb"/>
<text x="40" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1a1a1a">Endogeneit&#224; e variabili strumentali</text>
<text x="40" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#8a8a90">Vuoi sapere quanto l&#39;istruzione fa aumentare il salario. Ma chi &#232; pi&#249; capace studia di pi&#249; <tspan font-weight="700">e</tspan> guadagna di pi&#249;.</text>
<g transform="translate(50,130)"><text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1a1a1a">1. Il problema: l&#39;endogeneit&#224;</text><rect x="150" y="46" width="250" height="62" rx="10" fill="#f4f4f2" stroke="#45454a" stroke-width="2.2" stroke-dasharray="7 5"/><text x="275.0" y="77.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Capacit&#224;</text><text x="275.0" y="97.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a8a90" text-anchor="middle">non osservata</text><rect x="60" y="250" width="180" height="54" rx="10" fill="#ffffff" stroke="#45454a" stroke-width="2.2"/><text x="150.0" y="283.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Istruzione</text><rect x="330" y="250" width="180" height="54" rx="10" fill="#ffffff" stroke="#45454a" stroke-width="2.2"/><text x="420.0" y="283.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Salario</text><line x1="215" y1="112" x2="172.6" y2="238.3" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round"/><path d="M 170 246 L 169.1 237.0 L 176.1 239.4 z" fill="#C2410C"/><text x="140" y="173" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C2410C" text-anchor="middle">influenza</text><line x1="335" y1="112" x2="388.8" y2="238.5" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round"/><path d="M 392 246 L 385.4 239.9 L 392.2 237.0 z" fill="#C2410C"/><text x="422" y="173" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C2410C" text-anchor="middle">influenza</text><line x1="246" y1="277" x2="315.9" y2="277.0" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round"/><path d="M 324 277 L 315.8 280.7 L 315.8 273.3 z" fill="#1D4ED8"/><text x="285" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">l&#39;effetto che vuoi misurare</text><text x="0" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#45454a">La capacit&#224; individuale influenza <tspan font-weight="700">tutte e due</tspan>. Tu non la vedi, quindi finisce nell&#39;errore.</text><text x="0" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#45454a">Il coefficiente che stimi contiene anche <tspan font-weight="700" fill="#C2410C">la strada arancione</tspan>: &#232; <tspan font-weight="700">distorto</tspan>.</text></g>
<g transform="translate(680,130)"><text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1a1a1a">2. La soluzione: la variabile strumentale</text><rect x="230" y="46" width="250" height="62" rx="10" fill="#f4f4f2" stroke="#45454a" stroke-width="2.2" stroke-dasharray="7 5"/><text x="355.0" y="77.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Capacit&#224;</text><text x="355.0" y="97.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a8a90" text-anchor="middle">non osservata</text><rect x="0" y="250" width="165" height="54" rx="10" fill="#ffffff" stroke="#1D4ED8" stroke-width="2.2"/><text x="82.5" y="277.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Distanza</text><text x="82.5" y="297.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8a8a90" text-anchor="middle">dall&#39;universit&#224;</text><rect x="205" y="250" width="160" height="54" rx="10" fill="#ffffff" stroke="#45454a" stroke-width="2.2"/><text x="285.0" y="283.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Istruzione</text><rect x="410" y="250" width="160" height="54" rx="10" fill="#ffffff" stroke="#45454a" stroke-width="2.2"/><text x="490.0" y="283.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Salario</text><line x1="165" y1="277" x2="190.9" y2="277.0" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round"/><path d="M 199 277 L 190.8 280.7 L 190.8 273.3 z" fill="#1D4ED8"/><line x1="295" y1="112" x2="260.2" y2="238.2" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round"/><path d="M 258 246 L 256.6 237.1 L 263.7 239.1 z" fill="#C2410C"/><line x1="415" y1="112" x2="466.9" y2="238.5" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round"/><path d="M 470 246 L 463.5 239.8 L 470.3 237.0 z" fill="#C2410C"/><line x1="365" y1="277" x2="395.9" y2="277.0" stroke="#1D4ED8" stroke-width="2.6" stroke-linecap="round"/><path d="M 404 277 L 395.8 280.7 L 395.8 273.3 z" fill="#1D4ED8"/><text x="82" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">rilevanza</text><text x="82" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a8a90" text-anchor="middle">influenza l&#39;istruzione</text><text x="0" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#45454a"><tspan font-weight="700" fill="#1D4ED8">Esogeneit&#224;</tspan>: dalla distanza <tspan font-weight="700">non parte nessuna freccia</tspan> verso il salario</text><text x="0" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#45454a">n&#233; verso la capacit&#224;. Tocca il salario <tspan font-weight="700">solo attraverso l&#39;istruzione</tspan>.</text></g>
</svg>